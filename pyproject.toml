[project]
name = "codenix"
version = "0.1.0"
description = "My second remake of codenix"
readme = "README.md"
authors = [
    { name = "areacloser", email = "areacloser@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
codenix = "codenix:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
